<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 627px; overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0a2540 0%, #0f4c81 50%, #0077b5 100%);
    color: white;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 100%; height: 100%;
    display: flex; align-items: center;
    padding: 60px 80px;
    position: relative;
  }
  /* Decorative circles */
  .circle-1 {
    position: absolute; right: -80px; top: -80px;
    width: 400px; height: 400px; border-radius: 50%;
    background: rgba(0,119,181,0.25);
  }
  .circle-2 {
    position: absolute; right: 120px; bottom: -100px;
    width: 280px; height: 280px; border-radius: 50%;
    background: rgba(255,204,0,0.12);
  }
  .circle-3 {
    position: absolute; left: -60px; bottom: -60px;
    width: 220px; height: 220px; border-radius: 50%;
    background: rgba(0,200,150,0.15);
  }
  /* Accent bar */
  .accent-bar {
    position: absolute; left: 0; top: 0;
    width: 8px; height: 100%;
    background: linear-gradient(180deg, #ffcc00 0%, #00c896 100%);
  }
  .content { position: relative; z-index: 2; max-width: 780px; }
  .tag {
    display: inline-block;
    background: rgba(255,204,0,0.2);
    border: 1px solid rgba(255,204,0,0.5);
    color: #ffcc00;
    font-size: 14px; font-weight: 600;
    letter-spacing: 2px; text-transform: uppercase;
    padding: 6px 16px; border-radius: 20px;
    margin-bottom: 24px;
  }
  .headline {
    font-size: 56px; font-weight: 800; line-height: 1.1;
    margin-bottom: 20px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .headline span { color: #ffcc00; }
  .subtitle {
    font-size: 24px; font-weight: 400; line-height: 1.5;
    color: rgba(255,255,255,0.85);
    max-width: 640px;
  }
  .logo-area {
    position: absolute; right: 80px; bottom: 40px;
    display: flex; align-items: center; gap: 10px;
    z-index: 2;
  }
  .logo-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #0077b5;
  }
  .logo-text {
    font-size: 14px; color: rgba(255,255,255,0.5);
    letter-spacing: 1px; text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="card">
  <div class="accent-bar"></div>
  <div class="circle-1"></div>
  <div class="circle-2"></div>
  <div class="circle-3"></div>
  <div class="content">
    <div class="tag">{{ topic }}</div>
    <div class="headline">{{ headline_html | safe }}</div>
    <div class="subtitle">{{ subtitle }}</div>
  </div>
  <div class="logo-area">
    <div class="logo-dot"></div>
    <div class="logo-text">LinkedIn Post</div>
  </div>
</div>
</body>
</html>
